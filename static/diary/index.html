<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracker | Junfei's Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } }
    </script>
    <style>
        :root {
            --accent: #6366f1; --accent-light: #818cf8; --accent-bg: #eef2ff;
            --warm: #f59e0b; --success: #10b981; --danger: #ef4444;
            --surface: rgba(255,255,255,0.72); --surface-solid: #ffffff;
            --border: rgba(0,0,0,0.06); --text-primary: #1e1b4b; --text-secondary: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #fef3c7 100%);
            background-attachment: fixed; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh;
        }

        /* === Animations === */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
        @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes focusPulse { 0%,100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes ripple { 0% { transform: scale(0); opacity: 0.5; } 100% { transform: scale(4); opacity: 0; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .animate-fadein-up { animation: fadeInUp 0.5s ease both; }
        .animate-fadein { animation: fadeIn 0.4s ease both; }
        .animate-slide-right { animation: slideInRight 0.5s ease both; }
        .animate-scale-in { animation: scaleIn 0.4s ease both; }
        .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; } .stagger-4 { animation-delay: 0.2s; }
        .stagger-5 { animation-delay: 0.25s; } .stagger-6 { animation-delay: 0.3s; }

        /* === Cards === */
        .glass {
            background: var(--surface); backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border); border-radius: 1.25rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
        }
        .glass:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.08); transform: translateY(-2px); }

        /* === Buttons === */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white; border: none; border-radius: 0.75rem; font-weight: 600;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 4px 14px rgba(99,102,241,0.3);
            position: relative; overflow: hidden;
        }
        .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: white; border: none; border-radius: 0.75rem; font-weight: 600;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 4px 14px rgba(16,185,129,0.3);
        }
        .btn-success:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
        .btn-success:active { transform: scale(0.96); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white; border: none; border-radius: 0.75rem; font-weight: 600;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 4px 14px rgba(239,68,68,0.25);
        }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-danger:active { transform: scale(0.96); }
        .btn-ghost {
            background: transparent; border: 1.5px solid var(--border); border-radius: 0.75rem;
            color: var(--text-secondary); font-weight: 500;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
        }
        .btn-ghost:hover { background: rgba(99,102,241,0.06); border-color: var(--accent-light); color: var(--accent); transform: translateY(-1px); }
        .btn-ghost:active { transform: scale(0.96); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        /* === Inputs === */
        .input-field {
            background: rgba(255,255,255,0.8); border: 1.5px solid #e5e7eb;
            border-radius: 0.75rem; padding: 0.625rem 1rem;
            transition: all 0.25s ease; outline: none; width: 100%;
        }
        .input-field:focus { border-color: var(--accent-light); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); transform: scale(1.005); }

        /* === Mood === */
        .mood-btn {
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); cursor: pointer;
            position: relative;
        }
        .mood-btn:hover { transform: translateY(-6px) scale(1.2) rotate(5deg); }
        .mood-btn:active { transform: scale(0.9); }

        /* === Work Session (unified) === */
        .work-panel {
            background: linear-gradient(135deg, #f8fafc, #f0f4ff);
            border-radius: 1rem; border: 1px solid var(--border); padding: 1.5rem;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .work-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--success), var(--warm));
            opacity: 0.6;
        }
        .work-panel.is-working {
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            border-color: rgba(16,185,129,0.2);
            animation: breathe 3s ease-in-out infinite;
        }
        .work-panel.is-working::before { opacity: 1; }
        .pulse-dot {
            width: 10px; height: 10px; border-radius: 50%; background: var(--success);
            position: relative; display: inline-block;
        }
        .pulse-dot::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: var(--success); animation: pulse-ring 1.5s ease-out infinite;
        }

        /* === Tasks === */
        .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .task-item {
            background: var(--surface-solid); border: 1px solid var(--border);
            border-radius: 1rem; padding: 0.875rem 1rem;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            animation: fadeInUp 0.3s ease both;
        }
        .task-item:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.06); transform: translateX(4px); }
        .task-item.focusing {
            background: linear-gradient(135deg, #fef3c7, #fce7f3);
            border-color: #f59e0b; border-width: 1.5px;
            box-shadow: 0 8px 28px rgba(245,158,11,0.15);
        }
        .task-completed span.task-text { text-decoration: line-through; color: #9ca3af; }

        .timeline-entry {
            border-left: 3px solid var(--accent);
            background: linear-gradient(90deg, var(--accent-bg), transparent);
            padding: 0.625rem 0.875rem; border-radius: 0 0.75rem 0.75rem 0;
            transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
            animation: slideInRight 0.3s ease both;
        }
        .timeline-entry:hover { transform: translateX(8px); background: linear-gradient(90deg, #e0e7ff, transparent); box-shadow: 0 4px 12px rgba(99,102,241,0.1); }

        /* === Stats === */
        .stat-card {
            background: var(--surface-solid); border-radius: 1rem; padding: 1rem;
            text-align: center; border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .stat-card:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .stat-number { animation: countUp 0.4s ease both; }

        /* === Calendar === */
        .cal-day {
            border-radius: 0.5rem; padding: 0.375rem; text-align: center;
            font-size: 0.8125rem; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); font-weight: 500;
        }
        .cal-day:hover { background: #eef2ff; transform: scale(1.15); box-shadow: 0 4px 12px rgba(99,102,241,0.15); }
        .cal-day.has-record { background: linear-gradient(135deg, #c7d2fe, #ddd6fe); color: #4338ca; font-weight: 700; }
        .cal-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }

        /* === Chips === */
        .chip {
            display: inline-flex; align-items: center; padding: 0.375rem 0.875rem;
            border-radius: 9999px; font-size: 0.8125rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            border: 1.5px solid transparent;
        }
        .chip:hover { transform: translateY(-2px); }
        .chip:active { transform: scale(0.94); }
        .chip.active { background: var(--accent) !important; color: white !important; border-color: var(--accent); box-shadow: 0 4px 14px rgba(99,102,241,0.3); }

        .focus-pulse { animation: focusPulse 2s infinite; }
        .section-title { font-size: 1.125rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem; }
        .section-icon { width: 2rem; height: 2rem; border-radius: 0.5rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.875rem; color: white; }

        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9999px; }
        .timer-display { font-variant-numeric: tabular-nums; font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }

        .lang-toggle { cursor: pointer; user-select: none; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
        .lang-toggle:hover { transform: scale(1.08) rotate(-3deg); }
        .lang-toggle:active { transform: scale(0.92); }

        /* Work timer big display */
        .work-timer-big {
            font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .work-timer-big.is-running {
            background: linear-gradient(90deg, #10b981, #34d399, #10b981);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        /* Session log items */
        .session-log-item {
            transition: all 0.2s ease; animation: fadeInUp 0.3s ease both;
        }
        .session-log-item:hover { transform: translateX(4px); }

        /* Modal animations */
        .modal-backdrop { transition: opacity 0.25s ease; }
        .modal-content { animation: modalIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* === Header Clock === */
        .header-clock {
            font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* === Zen Fullscreen Mode === */
        .zen-overlay {
            position: fixed; inset: 0; z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; cursor: default;
        }
        .zen-overlay.active { display: flex; animation: fadeIn 0.8s ease both; }

        /* Sky - set dynamically by JS */
        .zen-bg { position: absolute; inset: 0; transition: background 8s ease; }

        /* Stars */
        .zen-stars { position: absolute; inset: 0; overflow: hidden; transition: opacity 3s ease; }
        .zen-star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle var(--tw-dur, 3s) ease-in-out infinite alternate;
            animation-delay: var(--tw-delay, 0s);
        }
        @keyframes twinkle { 0%{opacity:0.15; transform:scale(0.6)} 50%{opacity:1; transform:scale(1.3)} 100%{opacity:0.3; transform:scale(0.8)} }

        /* Clouds */
        .zen-clouds { position: absolute; inset: 0; overflow: hidden; transition: opacity 3s ease; }
        .zen-cloud {
            position: absolute; background: white; border-radius: 50%;
            filter: blur(1px); opacity: 0.7;
        }
        .zen-cloud::before, .zen-cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .zen-cloud-1 { width: 120px; height: 40px; animation: cloudDrift1 45s linear infinite; }
        .zen-cloud-1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .zen-cloud-1::after { width: 80px; height: 50px; top: -20px; left: 50px; }
        .zen-cloud-2 { width: 90px; height: 30px; animation: cloudDrift2 60s linear infinite; opacity: 0.5; }
        .zen-cloud-2::before { width: 45px; height: 45px; top: -22px; left: 15px; }
        .zen-cloud-2::after { width: 60px; height: 38px; top: -15px; left: 35px; }
        .zen-cloud-3 { width: 150px; height: 45px; animation: cloudDrift3 55s linear infinite; opacity: 0.4; }
        .zen-cloud-3::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .zen-cloud-3::after { width: 90px; height: 55px; top: -25px; left: 60px; }
        .zen-cloud-4 { width: 70px; height: 25px; animation: cloudDrift2 70s linear infinite; opacity: 0.35; }
        .zen-cloud-4::before { width: 35px; height: 35px; top: -18px; left: 10px; }
        .zen-cloud-4::after { width: 50px; height: 30px; top: -12px; left: 28px; }
        @keyframes cloudDrift1 { 0%{transform:translateX(-200px)} 100%{transform:translateX(calc(100vw + 200px))} }
        @keyframes cloudDrift2 { 0%{transform:translateX(calc(100vw + 150px))} 100%{transform:translateX(-250px)} }
        @keyframes cloudDrift3 { 0%{transform:translateX(-300px)} 100%{transform:translateX(calc(100vw + 300px))} }

        /* Mountains - color set by JS */
        .zen-mountains { position: absolute; bottom: 0; left: 0; right: 0; height: 35%; }
        .zen-mountain { position: absolute; bottom: 0; width: 0; height: 0; border-style: solid; border-color: transparent; transition: border-bottom-color 8s ease; }
        .zen-mountain-1 { left: -5%; border-width: 0 35vw 28vh 35vw; }
        .zen-mountain-2 { left: 15%; border-width: 0 30vw 35vh 30vw; }
        .zen-mountain-3 { left: 40%; border-width: 0 25vw 22vh 25vw; }
        .zen-mountain-4 { left: 55%; border-width: 0 35vw 30vh 35vw; }

        /* Fog */
        .zen-fog {
            position: absolute; bottom: 15%; left: -10%; right: -10%; height: 12%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), rgba(255,255,255,0.08), rgba(255,255,255,0.04), transparent);
            animation: fogDrift 20s ease-in-out infinite alternate; filter: blur(8px);
            transition: opacity 3s ease;
        }
        @keyframes fogDrift { 0%{transform:translateX(-5%)} 100%{transform:translateX(5%)} }

        /* Sun */
        .zen-sun {
            position: absolute; width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fff7b0, #fbbf24, #f59e0b);
            box-shadow: 0 0 60px 20px rgba(251,191,36,0.4), 0 0 120px 50px rgba(251,191,36,0.15);
            transition: left 60s linear, bottom 60s linear, opacity 3s ease, transform 3s ease;
        }
        .zen-sun-rays {
            position: absolute; width: 100%; height: 100%; animation: sunRotate 30s linear infinite;
        }
        .zen-sun-rays::before, .zen-sun-rays::after {
            content: ''; position: absolute; inset: -15px; border-radius: 50%;
            border: 2px solid rgba(251,191,36,0.15);
        }
        .zen-sun-rays::after { inset: -30px; border-color: rgba(251,191,36,0.08); }
        @keyframes sunRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

        /* Moon */
        .zen-moon {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f5f5f0, #e5e5d8);
            box-shadow: 0 0 40px 12px rgba(245,245,240,0.2), 0 0 80px 30px rgba(245,245,240,0.08);
            transition: left 60s linear, bottom 60s linear, opacity 3s ease, transform 3s ease;
        }
        .zen-moon-crater {
            position: absolute; border-radius: 50%; background: rgba(0,0,0,0.06);
        }
        .zen-moon-crater-1 { width: 12px; height: 12px; top: 15px; left: 10px; }
        .zen-moon-crater-2 { width: 8px; height: 8px; top: 28px; left: 28px; }
        .zen-moon-crater-3 { width: 6px; height: 6px; top: 12px; left: 30px; }
        .zen-moon-glow {
            position: absolute; inset: -8px; border-radius: 50%;
            background: radial-gradient(circle, rgba(245,245,240,0.1), transparent 70%);
            animation: moonBreathe 4s ease-in-out infinite;
        }
        @keyframes moonBreathe { 0%,100%{transform:scale(1);opacity:0.5} 50%{transform:scale(1.15);opacity:1} }

        /* Zen task name */
        .zen-task-name {
            z-index: 2; margin-top: 1.5rem;
            font-size: clamp(1rem, 3vw, 1.5rem); font-weight: 300;
            color: rgba(255,255,255,0.6); letter-spacing: 0.08em;
            padding: 0.5rem 1.5rem; border-radius: 9999px;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.6s ease both;
        }
        .zen-task-name i { margin-right: 0.5rem; color: rgba(255,255,255,0.4); }

        .zen-clock {
            font-size: clamp(4rem, 12vw, 8rem); font-weight: 200; color: white;
            letter-spacing: 0.05em; text-shadow: 0 2px 40px rgba(0,0,0,0.3);
            z-index: 2; line-height: 1;
        }
        .zen-date {
            font-size: clamp(0.875rem, 2vw, 1.25rem); color: rgba(255,255,255,0.5);
            font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase;
            margin-top: 0.5rem; z-index: 2;
        }
        .zen-work-timer {
            margin-top: 2rem; z-index: 2; text-align: center;
        }
        .zen-work-timer .label {
            font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.2em;
            text-transform: uppercase; margin-bottom: 0.5rem;
        }
        .zen-work-timer .time {
            font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 600; color: rgba(255,255,255,0.9);
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }
        .zen-work-timer .pulse-ring-zen {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #34d399; margin-right: 8px; vertical-align: middle;
            box-shadow: 0 0 12px 4px rgba(52,211,153,0.4);
            animation: focusPulse 2s infinite;
        }
        .zen-exit-btn {
            position: absolute; bottom: 2.5rem; z-index: 3;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 9999px;
            color: rgba(255,255,255,0.6); padding: 0.75rem 2rem;
            font-size: 0.875rem; font-weight: 500; cursor: pointer;
            transition: all 0.3s ease; letter-spacing: 0.05em;
        }
        .zen-exit-btn:hover { background: rgba(255,255,255,0.2); color: white; transform: translateY(-2px); }
        .zen-quote {
            position: absolute; bottom: 6rem; z-index: 2;
            font-size: 0.875rem; color: rgba(255,255,255,0.35); font-style: italic;
            max-width: 400px; text-align: center; line-height: 1.6;
        }

        /* === Zen Audio Panel === */
        .zen-audio {
            position: absolute; bottom: 2.5rem; left: 2rem; z-index: 3;
            display: flex; align-items: center; gap: 0.5rem;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 9999px;
            padding: 0.5rem 0.75rem; animation: fadeIn 1s ease 0.5s both;
        }
        .zen-audio-btn {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5); font-size: 0.75rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.25s ease; flex-shrink: 0;
        }
        .zen-audio-btn:hover { background: rgba(255,255,255,0.2); color: white; transform: scale(1.1); }
        .zen-audio-btn.active { background: rgba(99,102,241,0.4); border-color: rgba(99,102,241,0.5); color: white; }
        .zen-audio-btn.muted { opacity: 0.3; }
        .zen-volume {
            -webkit-appearance: none; appearance: none; width: 70px; height: 3px;
            background: rgba(255,255,255,0.15); border-radius: 9999px; outline: none;
            cursor: pointer; transition: opacity 0.3s ease;
        }
        .zen-volume::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
            background: rgba(255,255,255,0.7); cursor: pointer; transition: transform 0.15s ease;
        }

let currentLang = localStorage.getItem('diary_lang') || 'zh';

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
    document.querySelectorAll('.mood-btn').forEach(btn => { btn.title = t('moodNames')[btn.getAttribute('data-mood')] || ''; });
    document.getElementById('langLabel').textContent = currentLang === 'zh' ? 'EN' : '中文';
    updateDateDisplay();
    updateWorkUI();
    renderTasks(); renderFocusTimeline(); renderCalendar(); updateLineChart();
}

function toggleLang() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('diary_lang', currentLang);
    applyI18n();
}

function updateDateDisplay() {
    const now = new Date();
    if (currentLang === 'zh') {
        document.getElementById("dateDisplay").textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 周${t('weekDays')[now.getDay()]}`;
    } else {
        document.getElementById("dateDisplay").textContent = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) + ' · ' + t('weekDays')[now.getDay()];
    }
}

let tasks=[], workMap=new Map(), moodEntries=[], inspirationMap=new Map(), focusMap=new Map(), focusTimeline=[], completedHistory=[];

function getNowDateTimeStr() { return new Date().toLocaleString('zh-CN'); }

function formatSecs(sec) { let m=Math.floor(sec/60),s=sec%60; return `${m}:${s<10?'0'+s:s}`; }
function formatHMS(ms) {
    const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    return `${h<10?'0'+h:h}:${m<10?'0'+m:m}:${sec<10?'0'+sec:sec}`;
}

// ======================== UNIFIED WORK CLOCK ========================
// workRecord for today: { sessions: [{start, end, duration}], currentStart: null }
let workLiveTimer = null;

function getTodayWork() {
    let rec = workMap.get(getTodayStr());
    if (!rec) { rec = { sessions: [], currentStart: null, totalMinutes: 0 }; workMap.set(getTodayStr(), rec); }
    if (!rec.sessions) rec.sessions = [];
    return rec;
}

function workStartClick() {
    const rec = getTodayWork();
    if (rec.currentStart) return;
    rec.currentStart = Date.now();
    saveAll();
    startWorkLiveTimer();
    updateWorkUI();
    enterZenMode('work');
}

function workStopClick() {
    const rec = getTodayWork();
    if (!rec.currentStart) return;
    const elapsed = Math.floor((Date.now() - rec.currentStart) / 60000);
    const startTime = new Date(rec.currentStart).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    const endTime = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    rec.sessions.push({ start: startTime, end: endTime, duration: elapsed, startTs: rec.currentStart, endTs: Date.now() });
    rec.totalMinutes = rec.sessions.reduce((sum, s) => sum + s.duration, 0);
    rec.currentStart = null;
    saveAll();
    stopWorkLiveTimer();
    updateWorkUI();
    updateStatsAndCalendar();
}

function startWorkLiveTimer() {
    stopWorkLiveTimer();
    workLiveTimer = setInterval(() => updateWorkUI(), 1000);
}
function stopWorkLiveTimer() {
    if (workLiveTimer) { clearInterval(workLiveTimer); workLiveTimer = null; }
}

function updateWorkUI() {
    const rec = getTodayWork();
    const isWorking = !!rec.currentStart;
    const panel = document.getElementById('workPanel');
    const timerEl = document.getElementById('workTimerDisplay');
    const statusEl = document.getElementById('workStatusLine');
    const startBtn = document.getElementById('workStartBtn');
    const stopBtn = document.getElementById('workStopBtn');

    // Running time
    let runningMs = 0;
    if (isWorking) runningMs = Date.now() - rec.currentStart;
    // Total today in ms
    const sessionMs = rec.sessions.reduce((sum, s) => sum + s.duration * 60000, 0);
    const totalMs = sessionMs + runningMs;
    timerEl.textContent = formatHMS(totalMs);

    if (isWorking) {
        panel.classList.add('is-working');
        timerEl.classList.add('is-running');
        statusEl.innerHTML = `<span class="pulse-dot"></span> <span class="text-green-600 font-medium">${t('workingNow')}</span>`;
        startBtn.disabled = true; stopBtn.disabled = false;
    } else {
        panel.classList.remove('is-working');
        timerEl.classList.remove('is-running');
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-300 inline-block"></span> <span>${t('workReady')}</span>`;
        startBtn.disabled = false; stopBtn.disabled = true;
    }

    const totalMin = Math.floor(totalMs / 60000);
    document.getElementById("totalWorkMinutes").textContent = totalMin;
    document.getElementById("totalWorkHours").textContent = (totalMin / 60).toFixed(1);

    // Session log
    const logEl = document.getElementById('sessionLogList');
    if (rec.sessions.length === 0) {
        logEl.innerHTML = `<div class="text-xs text-gray-300 text-center py-1">${t('noSessions')}</div>`;
    } else {
        logEl.innerHTML = rec.sessions.map((s, i) => `
            <div class="session-log-item flex items-center justify-between text-xs bg-white/60 rounded-lg px-3 py-1.5 border border-gray-100" style="animation-delay:${i*0.05}s">
                <span class="font-medium text-gray-600"><i class="fas fa-circle text-[6px] text-indigo-400 mr-1.5"></i>${t('session').replace('{n}', i+1)}</span>
                <span class="text-gray-400 timer-display">${s.start} → ${s.end}</span>
                <span class="badge bg-indigo-50 text-indigo-600">${s.duration} ${t('minUnit')}</span>
            </div>
        `).join('');
    }
}

// ======================== FOCUS ========================
function addTimelineRecord(taskId, taskName, startDT, endDT, durSec) {
    focusTimeline.push({ id: Date.now()+Math.random(), taskId, taskName, startTime: startDT, endTime: endDT, durationSec: durSec, dateStr: getTodayStr() });
    saveAll(); renderFocusTimeline();
}
function updateFocusTodayUI() { document.getElementById("focusTotalToday").innerText = focusMap.get(getTodayStr()) || 0; }

function renderFocusTimeline() {
    const c = document.getElementById("focusTimelineList"); if (!c) return;
    const recs = focusTimeline.filter(r => r.dateStr === getTodayStr()).sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
    if (!recs.length) { c.innerHTML = `<div class="text-center text-gray-300 py-4 text-sm">${t('noFocusYet')}</div>`; return; }
    c.innerHTML = recs.map((r,i) => `
        <div class="timeline-entry flex justify-between items-center text-xs" style="animation-delay:${i*0.05}s">
            <div class="font-medium text-gray-700 flex-1"><i class="fas fa-brain text-indigo-400 mr-1"></i>${r.taskName}</div>
            <div class="text-gray-400 mx-3 timer-display">${r.startTime?.split(' ')[1]||'--'} → ${r.endTime?.split(' ')[1]||'--'}</div>
            <div class="badge bg-indigo-100 text-indigo-600 timer-display">${Math.floor(r.durationSec/60)}m ${r.durationSec%60}s</div>
        </div>`).join('');
}

function stopTaskTimerAndRecord(task) {
    if (task.timerInterval) { clearInterval(task.timerInterval); task.timerInterval = null; }
    if (task.isTimingActive && task.lastStartTimeStr) {
        const added = (task.focusSecs||0) - (task.lastFocusSecsBeforeStart||0);
        if (added > 0) {
            let tf = focusMap.get(getTodayStr()) || 0;
            tf += Math.floor(added/60);
            focusMap.set(getTodayStr(), tf);
            addTimelineRecord(task.id, task.text, task.lastStartTimeStr, getNowDateTimeStr(), added);
        }
        task.isTimingActive = false; task.lastStartTimeStr = null; task.lastFocusSecsBeforeStart = undefined;
        saveAll(); updateFocusTodayUI(); updateStatsAndCalendar();
    }
}
function startTaskTimer(task, cb) {
    if (task.isTimingActive) return;
    if (task.status === "done") { alert(t('completedCantTime')); return; }
    task.isTimingActive = true; task.lastStartTimeStr = getNowDateTimeStr();
    task.lastFocusSecsBeforeStart = task.focusSecs || 0;
    task.timerInterval = setInterval(() => {
        if (task.isTimingActive && task.status !== "done") {
            task.focusSecs = (task.focusSecs||0) + 1;
            if (cb) cb(task.focusSecs); saveAll();
        } else if (task.status === "done" && task.timerInterval) clearInterval(task.timerInterval);
    }, 1000);
    saveAll();
}

// ======================== RENDER TASKS ========================
function renderTasks() {
    tasks.forEach(tk => { if (tk.timerInterval) { clearInterval(tk.timerInterval); tk.timerInterval = null; } });
    const c = document.getElementById("taskList"); if (!c) return;
    const today = getTodayStr();
    const list = tasks.filter(tk => tk.status !== "done" || tk.completedDate === today);
    c.innerHTML = "";
    list.forEach((task, idx) => {
        const isFoc = task.isTimingActive && task.status !== "done";
        const li = document.createElement("li");
        li.className = `task-item flex flex-wrap items-center gap-3 ${isFoc?'focusing':''} ${task.status==='done'?'task-completed':''}`;
        li.style.animationDelay = `${idx * 0.04}s`;

        const statusBtn = document.createElement("button");
        const icons = { todo:"far fa-circle text-gray-300", doing:"fas fa-adjust text-amber-400", done:"fas fa-check-circle text-emerald-500" };
        statusBtn.innerHTML = `<i class="${icons[task.status]||icons.todo} text-lg"></i>`;
        statusBtn.className = "w-8 h-8 rounded-full hover:bg-gray-50 flex items-center justify-center transition flex-shrink-0";
        statusBtn.onclick = () => {
            if (task.status === "todo") task.status = "doing";
            else if (task.status === "doing") {
                if (!confirm(`${t('confirmComplete')} "${task.text}"?`)) return;
                if (task.isTimingActive) stopTaskTimerAndRecord(task);
                task.status = "done"; task.completedDate = getTodayStr(); task.completedTimeStr = getNowDateTimeStr();
                completedHistory.push({ taskId:task.id, taskName:task.text, completedDate:getTodayStr(), completedTimeStr:getNowDateTimeStr() });
                if (task.timerInterval) { clearInterval(task.timerInterval); task.timerInterval = null; }
                task.isTimingActive = false;
            } else {
                if (!confirm(t('confirmReset'))) return;
                if (task.isTimingActive) stopTaskTimerAndRecord(task);
                task.status = "todo"; delete task.completedDate; delete task.completedTimeStr;
                task.focusSecs = 0; task.isTimingActive = false;
                if (task.timerInterval) { clearInterval(task.timerInterval); task.timerInterval = null; }
            }
            saveAll(); renderTasks(); updateStatsAndCalendar();
        };

        const taskText = document.createElement("span");
        taskText.innerText = task.text;
        taskText.className = "task-text flex-1 font-medium text-sm text-gray-700 break-words";
        if (isFoc) {
            const b = document.createElement("span");
            b.className = "ml-2 inline-flex items-center gap-1 bg-amber-400 text-white text-[0.6rem] font-bold px-2 py-0.5 rounded-full focus-pulse";
            b.innerHTML = `<i class="fas fa-fire"></i> ${t('focusing')}`;
            taskText.appendChild(b);
        }

        const timerDiv = document.createElement("div");
        timerDiv.className = `flex items-center gap-1.5 ${isFoc?'bg-amber-50 border border-amber-200':'bg-gray-50'} rounded-lg px-2 py-1.5 flex-shrink-0 transition-all`;
        const timerSpan = document.createElement("span");
        timerSpan.className = "timer-display text-sm font-bold text-gray-600 min-w-[50px] text-center";
        const upd = s => { timerSpan.innerText = formatSecs(s); };
        upd(task.focusSecs || 0);

        const mk = (icon, cls) => { const b=document.createElement("button"); b.innerHTML=`<i class="fas fa-${icon}"></i>`; b.className=`w-7 h-7 rounded-md flex items-center justify-center text-xs text-white transition ${cls}`; return b; };
        const startBtn = mk("play","bg-emerald-500 hover:bg-emerald-600");
        const stopBtn = mk("pause","bg-amber-500 hover:bg-amber-600");
        const resetBtn = mk("redo-alt","bg-gray-400 hover:bg-gray-500");

        startBtn.onclick = () => {
            if (task.status === "done" || task.isTimingActive) return;
            startTaskTimer(task, s => {
                upd(s);
                if (!li.classList.contains('focusing')) {
                    li.classList.add('focusing'); timerDiv.classList.add('bg-amber-50','border','border-amber-200');
                    if (!taskText.querySelector('.focus-pulse')) {
                        const bb=document.createElement("span"); bb.className="ml-2 inline-flex items-center gap-1 bg-amber-400 text-white text-[0.6rem] font-bold px-2 py-0.5 rounded-full focus-pulse";
                        bb.innerHTML=`<i class="fas fa-fire"></i> ${t('focusing')}`; taskText.appendChild(bb);
                    }
                }
            });
            startBtn.classList.add('opacity-40','pointer-events-none'); stopBtn.classList.remove('opacity-40','pointer-events-none');
            enterZenMode('focus', task);
        };
        stopBtn.onclick = () => {
            if (!task.isTimingActive) return;
            stopTaskTimerAndRecord(task);
            li.classList.remove('focusing'); timerDiv.classList.remove('bg-amber-50','border','border-amber-200');
            const bb=taskText.querySelector('.focus-pulse'); if(bb) bb.remove();
            startBtn.classList.remove('opacity-40','pointer-events-none'); stopBtn.classList.add('opacity-40','pointer-events-none');
            if (zenMode === 'focus') exitZenMode();
            upd(task.focusSecs||0);
        };
        resetBtn.onclick = () => { if (task.isTimingActive) stopBtn.click(); task.focusSecs=0; upd(0); saveAll(); updateFocusTodayUI(); };

        if (isFoc) startBtn.classList.add('opacity-40','pointer-events-none');
        else stopBtn.classList.add('opacity-40','pointer-events-none');

        timerDiv.append(startBtn, stopBtn, timerSpan, resetBtn);

        const delBtn = document.createElement("button");
        delBtn.innerHTML = '<i class="fas fa-times"></i>';
        delBtn.className = "w-7 h-7 rounded-md flex items-center justify-center text-gray-300 hover:text-red-400 hover:bg-red-50 transition flex-shrink-0";
        delBtn.onclick = () => { if (confirm(`${t('confirmDelete')} "${task.text}"?`)) { if(task.timerInterval) clearInterval(task.timerInterval); tasks=tasks.filter(x=>x.id!==task.id); saveAll(); renderTasks(); updateStatsAndCalendar(); renderFocusTimeline(); } };

        li.append(statusBtn, taskText, timerDiv, delBtn);
        c.appendChild(li);

        if (isFoc && !task.timerInterval) {
            startTaskTimer(task, s => { upd(s); if (!li.classList.contains('focusing')) li.classList.add('focusing'); });
        }
    });
    updateFocusTodayUI(); renderFocusTimeline();
}

function getPeriodDates(p) {

    else if (p==="month") { const y=now.getFullYear(),m=now.getMonth(); for(let i=1;i<=new Date(y,m+1,0).getDate();i++) d.push(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`); }
    else { for(let m=1;m<=12;m++) d.push(`${now.getFullYear()}-${String(m).padStart(2,'0')}-01`); }

}

// ======================== AMBIENT SOUND ENGINE ========================
let audioCtx = null;
let ambientNodes = [];
let ambientIntervals = [];
let ambientGain = null;
let currentSound = 'rain';
let audioMuted = false;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = 0.4;
    ambientGain.connect(audioCtx.destination);
}

function makeNoise(seconds) {
    const sr = audioCtx.sampleRate, len = sr * seconds;
    const buf = audioCtx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        // Brown noise: integrated white noise, sounds warmer/more natural
        let last = 0;
        for (let i = 0; i < len; i++) {
            const w = Math.random() * 2 - 1;
            last = (last + 0.02 * w) / 1.02;
            d[i] = last * 3.5;
        }
    }
    return buf;
}

function makeWhiteNoise(seconds) {
    const sr = audioCtx.sampleRate, buf = audioCtx.createBuffer(2, sr * seconds, sr);
    for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return buf;
}

// Helper: looping noise source
function noiseSrc(buf) {
    const s = audioCtx.createBufferSource();
    s.buffer = buf; s.loop = true; s.start();
    ambientNodes.push(s);
    return s;
}
// Helper: LFO
function lfo(freq, amount, target) {
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = freq;
    const g = audioCtx.createGain(); g.gain.value = amount;
    o.connect(g).connect(target);
    o.start(); ambientNodes.push(o);
    return o;
}
// Helper: filter
function filt(type, freq, q) {
    const f = audioCtx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    return f;
}
// Helper: gain
function gn(v) {
    const g = audioCtx.createGain(); g.gain.value = v;
    return g;
}

function startSound(type) {
    stopAllSounds();
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    currentSound = type;

    const brown = makeNoise(6);
    const white = makeWhiteNoise(4);

    if (type === 'rain') {
        // Layer 1: Steady rain body — warm mid-frequency noise
        const s1 = noiseSrc(brown);
        const f1 = filt('bandpass', 1200, 0.4);
        const g1 = gn(0.45);
        s1.connect(f1).connect(g1).connect(ambientGain);

        // Layer 2: Rain patter — soft high-frequency detail
        const s2 = noiseSrc(white);
        const f2a = filt('highpass', 2500);
        const f2b = filt('lowpass', 8000);
        const g2 = gn(0.08);
        // Gentle volume variation for realism
        const lfo2 = lfo(0.15, 0.03, g2.gain);
        s2.connect(f2a).connect(f2b).connect(g2).connect(ambientGain);

        // Layer 3: Deep distant rumble
        const s3 = noiseSrc(brown);
        const f3 = filt('lowpass', 120);
        const g3 = gn(0.2);
        const lfo3 = lfo(0.04, 0.12, g3.gain);
        s3.connect(f3).connect(g3).connect(ambientGain);

        // Layer 4: Drip splashes — occasional droplet texture
        const s4 = noiseSrc(white);
        const f4 = filt('bandpass', 4000, 2);
        const g4 = gn(0.04);
        const lfo4 = lfo(0.25, 0.03, g4.gain);
        s4.connect(f4).connect(g4).connect(ambientGain);

        // Layer 5: Roof/surface resonance
        const s5 = noiseSrc(brown);
        const f5 = filt('bandpass', 600, 0.8);
        const g5 = gn(0.15);
        s5.connect(f5).connect(g5).connect(ambientGain);
    }
    else if (type === 'wheat') {
        // Wind through wheat field: warm, gentle, rustling

        // Layer 1: Base warm wind — very soft, low
        const s1 = noiseSrc(brown);
        const f1 = filt('lowpass', 400);
        const g1 = gn(0.3);
        const lfo1 = lfo(0.035, 0.15, g1.gain); // slow swell
        s1.connect(f1).connect(g1).connect(ambientGain);

        // Layer 2: Mid rustling — the "shhhh" of wheat stalks
        const s2 = noiseSrc(white);
        const f2a = filt('bandpass', 1800, 0.6);
        const f2b = filt('bandpass', 2400, 0.5);
        const g2 = gn(0.06);
        const lfo2a = lfo(0.07, 0.04, g2.gain); // gentle volume wave
        lfo(0.05, 400, f2a.frequency); // sweep the filter slowly
        s2.connect(f2a).connect(f2b).connect(g2).connect(ambientGain);

        // Layer 3: High soft shimmer — leaves and tips
        const s3 = noiseSrc(white);
        const f3 = filt('bandpass', 5000, 1.5);
        const g3 = gn(0.015);
        const lfo3 = lfo(0.09, 0.01, g3.gain);
        lfo(0.04, 1500, f3.frequency);
        s3.connect(f3).connect(g3).connect(ambientGain);

        // Layer 4: Deep warm undertone — earth/field
        const s4 = noiseSrc(brown);
        const f4 = filt('lowpass', 200);
        const g4 = gn(0.12);
        s4.connect(f4).connect(g4).connect(ambientGain);

        // Layer 5: Occasional gust — sweeping bandpass surge
        const s5 = noiseSrc(brown);
        const f5 = filt('bandpass', 700, 0.3);
        const g5 = gn(0.08);
        lfo(0.02, 0.06, g5.gain); // very slow swell
        lfo(0.025, 300, f5.frequency);
        s5.connect(f5).connect(g5).connect(ambientGain);
    }
    else if (type === 'frogs') {
        // Summer night with frogs, crickets, gentle warmth

        // Layer 1: Warm night air base
        const s1 = noiseSrc(brown);
        const f1 = filt('lowpass', 250);
        const g1 = gn(0.18);
        s1.connect(f1).connect(g1).connect(ambientGain);

        // Layer 2: Crickets — continuous high chirp
        [4100, 4600, 5200].forEach(freq => {
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.value = freq + Math.random() * 300;
            // Rapid tremolo gives chirping texture
            const trem = audioCtx.createOscillator();
            trem.type = 'square'; trem.frequency.value = 12 + Math.random() * 10;
            const tremG = gn(0.008 + Math.random() * 0.005);
            const outG = gn(0);
            trem.connect(tremG); tremG.connect(outG.gain);
            o.connect(outG).connect(ambientGain);
            o.start(); trem.start();
            ambientNodes.push(o, trem);
        });

        // Layer 3: Frogs — periodic calls at natural rhythms
        // Each frog: short descending sine chirp, repeated at random intervals
        const frogConfigs = [
            { freq: 420, dur: 0.12, interval: [1.5, 3.5], vol: 0.06 },   // small tree frog - quick "peep"
            { freq: 280, dur: 0.25, interval: [2.0, 5.0], vol: 0.05 },   // medium frog - "ribbit"
            { freq: 180, dur: 0.4,  interval: [3.0, 8.0], vol: 0.04 },   // bullfrog - deep "croak"
            { freq: 520, dur: 0.08, interval: [0.8, 2.0], vol: 0.04 },   // tiny frog - rapid "pip"
            { freq: 350, dur: 0.18, interval: [2.5, 6.0], vol: 0.045 },  // another mid frog
        ];

        frogConfigs.forEach(cfg => {
            function chirp() {
                if (!audioCtx || audioCtx.state === 'closed') return;
                const now = audioCtx.currentTime;
                const o = audioCtx.createOscillator();
                o.type = 'sine';
                // Frequency sweep down for natural chirp
                o.frequency.setValueAtTime(cfg.freq * (1 + Math.random() * 0.1), now);
                o.frequency.exponentialRampToValueAtTime(cfg.freq * 0.7, now + cfg.dur);

                const env = audioCtx.createGain();
                env.gain.setValueAtTime(0, now);
                env.gain.linearRampToValueAtTime(cfg.vol, now + cfg.dur * 0.1);
                env.gain.setValueAtTime(cfg.vol, now + cfg.dur * 0.6);
                env.gain.exponentialRampToValueAtTime(0.001, now + cfg.dur);

                o.connect(env).connect(ambientGain);
                o.start(now);
                o.stop(now + cfg.dur + 0.05);

                // Some frogs do double/triple chirps
                if (Math.random() < 0.4) {
                    const o2 = audioCtx.createOscillator();
                    o2.type = 'sine';
                    const t2 = now + cfg.dur + 0.06;
                    o2.frequency.setValueAtTime(cfg.freq * (1 + Math.random() * 0.08), t2);
                    o2.frequency.exponentialRampToValueAtTime(cfg.freq * 0.72, t2 + cfg.dur * 0.9);
                    const env2 = audioCtx.createGain();
                    env2.gain.setValueAtTime(0, t2);
                    env2.gain.linearRampToValueAtTime(cfg.vol * 0.8, t2 + cfg.dur * 0.1);
                    env2.gain.exponentialRampToValueAtTime(0.001, t2 + cfg.dur * 0.9);
                    o2.connect(env2).connect(ambientGain);
                    o2.start(t2);
                    o2.stop(t2 + cfg.dur + 0.05);
                }

                // Schedule next chirp at random interval
                const next = cfg.interval[0] + Math.random() * (cfg.interval[1] - cfg.interval[0]);
                const tid = setTimeout(chirp, next * 1000);
                ambientIntervals.push(tid);
            }
            // Stagger start
            const startDelay = Math.random() * 3000;
            const tid = setTimeout(chirp, startDelay);
            ambientIntervals.push(tid);
        });

        // Layer 4: Gentle water nearby (pond surface)
        const s4 = noiseSrc(brown);
        const f4a = filt('bandpass', 800, 0.5);
        const g4 = gn(0.03);
        const lfo4 = lfo(0.1, 0.015, g4.gain);
        s4.connect(f4a).connect(g4).connect(ambientGain);
    }
    else if (type === 'fire') {
        // Fireplace: warm crackling + deep roar + pops

        // Layer 1: Deep warm roar — the body of the fire
        const s1 = noiseSrc(brown);
        const f1 = filt('lowpass', 300);
        const g1 = gn(0.28);
        const lfo1 = lfo(0.06, 0.08, g1.gain); // slow breathing
        s1.connect(f1).connect(g1).connect(ambientGain);

        // Layer 2: Mid crackle texture
        const s2 = noiseSrc(white);
        const f2 = filt('bandpass', 2000, 1.2);
        const g2 = gn(0.04);
        const lfo2 = lfo(0.3, 0.025, g2.gain);
        s2.connect(f2).connect(g2).connect(ambientGain);

        // Layer 3: High hiss — flames licking
        const s3 = noiseSrc(white);
        const f3 = filt('bandpass', 5000, 1.5);
        const g3 = gn(0.015);
        lfo(0.08, 0.01, g3.gain);
        lfo(0.05, 1500, f3.frequency);
        s3.connect(f3).connect(g3).connect(ambientGain);

        // Layer 4: Random pops and crackles
        function pop() {
            if (!audioCtx || audioCtx.state === 'closed') return;
            const now = audioCtx.currentTime;
            // A pop = very short burst of filtered noise
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.15));
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            const f = filt('bandpass', 800 + Math.random() * 3000, 1 + Math.random() * 3);
            const env = gn(0.05 + Math.random() * 0.08);
            src.connect(f).connect(env).connect(ambientGain);
            src.start(now);

            // Sometimes a double pop
            if (Math.random() < 0.3) {
                const buf2 = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
                const d2 = buf2.getChannelData(0);
                for (let i = 0; i < d2.length; i++) d2[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d2.length * 0.1));
                const src2 = audioCtx.createBufferSource();
                src2.buffer = buf2;
                const f2 = filt('bandpass', 1500 + Math.random() * 2000, 2);
                const env2 = gn(0.04 + Math.random() * 0.06);
                src2.connect(f2).connect(env2).connect(ambientGain);
                src2.start(now + 0.05 + Math.random() * 0.08);
            }

            // Random next pop
            const next = 0.15 + Math.random() * 0.8;
            const tid = setTimeout(pop, next * 1000);
            ambientIntervals.push(tid);
        }
        const startTid = setTimeout(pop, 300);
        ambientIntervals.push(startTid);

        // Layer 5: Wood settling — occasional deeper knock
        function knock() {
            if (!audioCtx || audioCtx.state === 'closed') return;
            const now = audioCtx.currentTime;
            const o = audioCtx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(150 + Math.random() * 100, now);
            o.frequency.exponentialRampToValueAtTime(60, now + 0.15);
            const env = gn(0);
            env.gain.setValueAtTime(0, now);
            env.gain.linearRampToValueAtTime(0.06, now + 0.01);
            env.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            o.connect(env).connect(ambientGain);
            o.start(now); o.stop(now + 0.2);
            const next = 2 + Math.random() * 6;
            const tid = setTimeout(knock, next * 1000);
            ambientIntervals.push(tid);
        }
        const knockTid = setTimeout(knock, 1500 + Math.random() * 3000);
        ambientIntervals.push(knockTid);
    }
}

function stopAllSounds() {
    ambientNodes.forEach(n => { try { n.stop(); } catch(e) { try { n.disconnect(); } catch(e2){} } });
    ambientNodes = [];
    ambientIntervals.forEach(id => clearTimeout(id));
    ambientIntervals = [];
}

function setAudioVolume(v) {
    if (ambientGain) ambientGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
}

function toggleMute() {
    audioMuted = !audioMuted;
    const btn = document.getElementById('zenMuteBtn');
    if (audioMuted) {
        setAudioVolume(0);
        btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        btn.classList.add('muted');
    } else {
        setAudioVolume(document.getElementById('zenVolume').value / 100);
        btn.innerHTML = '<i class="fas fa-volume-up"></i>';
        btn.classList.remove('muted');
    }
}

function initAudioControls() {
    document.getElementById('zenMuteBtn').onclick = toggleMute;
    document.getElementById('zenVolume').oninput = (e) => {
        if (!audioMuted) setAudioVolume(e.target.value / 100);
    };
    document.querySelectorAll('[data-sound]').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('[data-sound]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            startSound(btn.dataset.sound);
            if (!audioMuted) setAudioVolume(document.getElementById('zenVolume').value / 100);
        };
    });
}

// --- Time-of-day scene system ---
// Sunrise 6:00, Solar noon ~12:00, Sunset ~18:30, Midnight 0:00
// Sun visible 6:00-18:30, Moon visible 18:30-6:00
// Celestial arc: rises from left-bottom, peaks at center-top, sets at right-bottom

function getTimePhase(hour, minute) {
    const t = hour + minute / 60;
    if (t >= 5 && t < 7) return 'dawn';
    if (t >= 7 && t < 11) return 'morning';
    if (t >= 11 && t < 14) return 'noon';
    if (t >= 14 && t < 17) return 'afternoon';
    if (t >= 17 && t < 19.5) return 'sunset';
    if (t >= 19.5 && t < 21) return 'dusk';
    return 'night';
}

const SKY_THEMES = {
    dawn:      { bg: 'linear-gradient(180deg, #2d1b69 0%, #764ba2 25%, #f093fb 50%, #f5af19 75%, #ffecd2 100%)',
                 mt: ['#3d2b5a','#4a3568','#5e4080','#6b4d8e'], text: 'rgba(255,255,255,0.85)' },
    morning:   { bg: 'linear-gradient(180deg, #56CCF2 0%, #89CFF0 30%, #B6E0F0 60%, #E8F4FD 100%)',
                 mt: ['#5B8A72','#4A7A64','#6B9E80','#3D6B56'], text: 'rgba(30,50,80,0.8)' },
    noon:      { bg: 'linear-gradient(180deg, #2196F3 0%, #64B5F6 30%, #90CAF9 60%, #BBDEFB 100%)',
                 mt: ['#4E8B5E','#3D7A4E','#5E9B6E','#2D6B3E'], text: 'rgba(30,50,80,0.75)' },
    afternoon: { bg: 'linear-gradient(180deg, #4A90D9 0%, #7BB3E0 30%, #A8CCE8 60%, #D4E6F1 100%)',
                 mt: ['#5E7B5E','#4D6A4D','#6E8B6E','#3D5A3D'], text: 'rgba(40,50,70,0.8)' },
    sunset:    { bg: 'linear-gradient(180deg, #2D3561 0%, #C33764 25%, #F77062 50%, #FE8C00 75%, #FFE259 100%)',
                 mt: ['#2D1F3D','#3D2B50','#4E3660','#5F4170'], text: 'rgba(255,255,255,0.9)' },
    dusk:      { bg: 'linear-gradient(180deg, #0F0C29 0%, #302B63 30%, #544E80 50%, #24243e 100%)',
                 mt: ['#1a1530','#221e3d','#2b264a','#191430'], text: 'rgba(255,255,255,0.85)' },
    night:     { bg: 'linear-gradient(180deg, #0a0a1a 0%, #0d1025 20%, #141832 40%, #1a1e3e 70%, #0f1020 100%)',
                 mt: ['#0c0c1e','#10102a','#141436','#0a0a18'], text: 'rgba(255,255,255,0.8)' },
};

// Compute celestial body position on an arc given time range
// Returns {x: 0-100 (%), y: 0-100 (% from bottom)} — arc peaks at midpoint
function celestialPos(currentT, riseT, setT) {
    let span = setT - riseT;
    if (span < 0) span += 24; // wraps past midnight
    let elapsed = currentT - riseT;
    if (elapsed < 0) elapsed += 24;
    const progress = Math.max(0, Math.min(1, elapsed / span)); // 0=rise, 1=set
    const x = 10 + progress * 80; // 10% to 90%
    // Arc: sin curve, peak at 0.5
    const arcHeight = Math.sin(progress * Math.PI);
    const y = 8 + arcHeight * 55; // 8% to 63% from bottom
    return { x, y, progress };
}

function generateStars() {
    const c = document.getElementById('zenStars'); if (!c) return;
    c.innerHTML = '';
    for (let i = 0; i < 100; i++) {
        const s = document.createElement('div');
        s.className = 'zen-star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 65 + '%';
        const dur = 2 + Math.random() * 5;
        const delay = Math.random() * 6;
        s.style.setProperty('--tw-dur', dur + 's');
        s.style.setProperty('--tw-delay', delay + 's');
        const size = 1 + Math.random() * 2.5;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        c.appendChild(s);
    }
}

function updateZenScene() {
    const now = new Date();
    const hour = now.getHours(), min = now.getMinutes();
    const tNow = hour + min / 60;
    const phase = getTimePhase(hour, min);
    const theme = SKY_THEMES[phase];

    // Sky
    document.getElementById('zenBg').style.background = theme.bg;

    // Mountains
    const mts = document.querySelectorAll('.zen-mountain');
    theme.mt.forEach((c, i) => { if (mts[i]) mts[i].style.borderBottomColor = c; });

    // Stars: visible at night/dusk, fading at dawn/sunset
    const starsEl = document.getElementById('zenStars');
    const isNighty = ['night','dusk','dawn'].includes(phase);
    starsEl.style.opacity = phase === 'night' ? '1' : phase === 'dusk' ? '0.7' : phase === 'dawn' ? '0.3' : '0';

    // Clouds: visible during daytime
    const cloudsEl = document.getElementById('zenClouds');
    const isDaytime = ['morning','noon','afternoon'].includes(phase);
    cloudsEl.style.opacity = isDaytime ? '1' : phase === 'dawn' || phase === 'sunset' ? '0.4' : '0';

    // Fog: stronger at dawn/dusk
    const fogEl = document.getElementById('zenFog');
    fogEl.style.opacity = (phase === 'dawn' || phase === 'dusk') ? '1' : isDaytime ? '0.3' : '0.5';

    // Sun position (rises ~6, sets ~18.5)
    const sunEl = document.getElementById('zenSun');
    const sunRise = 6, sunSet = 18.5;
    const sunVisible = tNow >= sunRise && tNow <= sunSet;
    if (sunVisible) {
        const sp = celestialPos(tNow, sunRise, sunSet);
        sunEl.style.left = sp.x + '%';
        sunEl.style.bottom = sp.y + '%';
        sunEl.style.opacity = '1';
        sunEl.style.transform = 'translate(-50%, 50%)';
        // Near horizon: bigger & more orange glow
        const horizonProx = 1 - Math.sin(sp.progress * Math.PI);
        sunEl.style.boxShadow = `0 0 ${60 + horizonProx * 40}px ${20 + horizonProx * 30}px rgba(251,191,36,${0.3 + horizonProx * 0.3})`;
    } else {
        sunEl.style.opacity = '0';
    }

    // Moon position (rises ~18.5, sets ~6)
    const moonEl = document.getElementById('zenMoon');
    const moonRise = 18.5, moonSet = 6;
    // Moon visible: from 18.5 to 6 (next day)
    const moonVisible = tNow >= moonRise || tNow <= moonSet;
    if (moonVisible) {
        const mp = celestialPos(tNow, moonRise, moonSet);
        moonEl.style.left = mp.x + '%';
        moonEl.style.bottom = mp.y + '%';
        moonEl.style.opacity = '1';
        moonEl.style.transform = 'translate(-50%, 50%)';
    } else {
        moonEl.style.opacity = '0';
    }

    // Clock text color
    const clockEl = document.getElementById('zenClock');
    const dateEl = document.getElementById('zenDate');
    if (clockEl) clockEl.style.color = theme.text;
    if (dateEl) clockEl.style.textShadow = isDaytime ? '0 2px 20px rgba(0,0,0,0.1)' : '0 2px 40px rgba(0,0,0,0.3)';
}

function updateZenClock() {
    const now = new Date();
    const zenCl = document.getElementById('zenClock');
    if (zenCl) zenCl.textContent = [now.getHours(), now.getMinutes(), now.getSeconds()].map(v => String(v).padStart(2,'0')).join(':');

    const zenDt = document.getElementById('zenDate');
    if (zenDt) {
        zenDt.textContent = currentLang === 'zh'
            ? `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 周${t('weekDays')[now.getDay()]}`
            : now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Update timer based on mode
    const zenWt = document.getElementById('zenWorkTimer');
    if (zenMode === 'focus' && zenFocusTask) {
        if (zenWt) zenWt.textContent = formatSecs(zenFocusTask.focusSecs || 0);
    } else {
        const rec = getTodayWork();
        if (rec.currentStart) {
            const runMs = Date.now() - rec.currentStart;
            const sessMs = rec.sessions.reduce((s, x) => s + x.duration * 60000, 0);
            if (zenWt) zenWt.textContent = formatHMS(sessMs + runMs);
        }
    }

    updateZenScene();
}

let zenMode = null; // 'work' or 'focus'
let zenFocusTask = null; // reference to the task being focused

function enterZenMode(mode, taskObj) {
    zenMode = mode || 'work';
    zenFocusTask = taskObj || null;
    generateStars();
    updateZenScene();
    document.getElementById('zenOverlay').classList.add('active');
    const quotes = t('quotes');
    document.getElementById('zenQuote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    // Task name display
    const taskNameEl = document.getElementById('zenTaskName');
    const labelEl = document.getElementById('zenTimerLabel');
    if (zenMode === 'focus' && zenFocusTask) {
        taskNameEl.innerHTML = `<i class="fas fa-crosshairs"></i>${zenFocusTask.text}`;
        taskNameEl.style.display = 'block';
        labelEl.textContent = t('focusing');
    } else {
        taskNameEl.style.display = 'none';
        labelEl.textContent = t('workingNow');
    }

    updateZenClock();
    if (zenClockInterval) clearInterval(zenClockInterval);
    zenClockInterval = setInterval(updateZenClock, 1000);
    document.body.style.overflow = 'hidden';
    // Start ambient audio
    initAudio();
    startSound(currentSound);
    if (!audioMuted) setAudioVolume(document.getElementById('zenVolume').value / 100);
}

function exitZenMode() {
    document.getElementById('zenOverlay').classList.remove('active');
    if (zenClockInterval) { clearInterval(zenClockInterval); zenClockInterval = null; }
    document.body.style.overflow = '';
    zenMode = null;
    zenFocusTask = null;
    stopAllSounds();
}

// ======================== INIT ========================
function init() {
    loadAll();
    tasks.forEach(tk => { delete tk.timerInterval; if(tk.isTimingActive) tk.isTimingActive=false; });
    tasks.forEach(tk => { if(tk.status==="未开始")tk.status="todo"; else if(tk.status==="进行中")tk.status="doing"; else if(tk.status==="已完成")tk.status="done"; });
    saveAll();
    applyI18n();
    renderTasks();

    // Start header clock
    startHeaderClock();

    // Resume work timer if working
    const rec = getTodayWork();
    if (rec.currentStart) { startWorkLiveTimer(); enterZenMode('work'); }
    updateWorkUI();
    updateFocusTodayUI();

    // Events
    document.getElementById("langToggleBtn").onclick = toggleLang;
    document.getElementById("workStartBtn").onclick = workStartClick;
    document.getElementById("workStopBtn").onclick = workStopClick;
    document.getElementById("zenExitBtn").onclick = exitZenMode;
    initAudioControls();
    document.getElementById("addTaskBtn").onclick = () => {
        const v=document.getElementById("newTaskInput").value.trim();
        if(v){tasks.push({id:Date.now()+Math.random(),text:v,status:"todo",createdAt:new Date().toISOString(),focusSecs:0,isTimingActive:false});saveAll();renderTasks();updateStatsAndCalendar();document.getElementById("newTaskInput").value="";}
    };
    document.getElementById("newTaskInput").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("addTaskBtn").click(); });
    document.getElementById("viewMoodHistoryBtn").onclick = showMoodHistory;
    document.getElementById("viewTaskHistoryBtn").onclick = showTaskHistory;
    document.getElementById("closeMoodModal").onclick = () => document.getElementById("moodModal").classList.add("hidden");
    document.getElementById("closeTaskModal").onclick = () => document.getElementById("taskHistoryModal").classList.add("hidden");
    document.getElementById("exportDataBtn").onclick = exportData;
    document.getElementById("importDataBtn").onclick = () => document.getElementById("importFile").click();
    document.getElementById("importFile").onchange = e => importData(e.target.files[0]);
    document.getElementById("clearAllDataBtn").onclick = () => { if(confirm(t('clearAllConfirm'))&&confirm(t('clearAllConfirm2'))){localStorage.clear();location.reload();} };
    document.getElementById("clearTimelineBtn").onclick = () => { if(confirm(t('clearTimeline'))){focusTimeline=focusTimeline.filter(r=>r.dateStr!==getTodayStr());saveAll();renderFocusTimeline();} };
    document.querySelectorAll(".mood-btn").forEach(btn => btn.addEventListener("click", () => recordMood(btn.getAttribute("data-mood"))));
    document.getElementById("inspirationText").addEventListener("input", () => { inspirationMap.set(getTodayStr(), document.getElementById("inspirationText").value); saveAll(); });
    document.getElementById("inspirationText").value = inspirationMap.get(getTodayStr()) || "";
    document.getElementById("dailyThemeInput").addEventListener("change", () => saveAll());
    document.querySelectorAll('[data-period]').forEach(btn => { btn.onclick=()=>{document.querySelectorAll('[data-period]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');updateStatsAndCalendar(btn.dataset.period);}; });
    document.querySelectorAll('[data-metric]').forEach(btn => { btn.onclick=()=>{document.querySelectorAll('[data-metric]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentMetric=btn.dataset.metric;updateLineChart();}; });
    ['moodModal','taskHistoryModal'].forEach(id => { document.getElementById(id).addEventListener("click", e => { if(e.target.id===id) e.target.classList.add("hidden"); }); });
    document.querySelector('[data-period="week"]').classList.add('active');
    updateStatsAndCalendar("week");
}
init();
</script>
</body>
</html>
