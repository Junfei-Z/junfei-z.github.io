<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <defs>
    <style>
      .sym  { font-family: "Latin Modern Math", "STIX Two Math", Georgia, serif; fill: #aab4cc; }
      .net  { fill: none; stroke: #aab4cc; stroke-width: 2; stroke-linecap: round; }
      .nod  { fill: #aab4cc; }
      .chip { fill: none; stroke: #aab4cc; stroke-width: 2; stroke-linejoin: round; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; fill: #aab4cc; }
    </style>
  </defs>
  <g opacity="0.5">

    <!-- math symbols -->
    <text class="sym" x="70"  y="120" font-size="46" transform="rotate(-12 70 120)">&#8711;</text>
    <text class="sym" x="540" y="90"  font-size="52" transform="rotate(8 540 90)">&#931;</text>
    <text class="sym" x="300" y="200" font-size="50" transform="rotate(-6 300 200)">&#8747;</text>
    <text class="sym" x="640" y="320" font-size="44" transform="rotate(10 640 320)">&#8706;</text>
    <text class="sym" x="120" y="420" font-size="46" transform="rotate(6 120 420)">&#955;</text>
    <text class="sym" x="470" y="470" font-size="48" transform="rotate(-9 470 470)">&#8721;</text>
    <text class="sym" x="250" y="620" font-size="44" transform="rotate(7 250 620)">&#8711;&#178;</text>
    <text class="mono" x="40"  y="600" font-size="20" transform="rotate(-5 40 600)">argmin</text>
    <text class="mono" x="560" y="650" font-size="20" transform="rotate(6 560 650)">x*</text>

    <!-- matrix brackets -->
    <g transform="translate(610 540) rotate(-8)">
      <path class="chip" d="M0 0 h-10 v44 h10 M40 0 h10 v44 h-10"/>
      <circle class="nod" cx="14" cy="12" r="2.4"/><circle class="nod" cx="32" cy="12" r="2.4"/>
      <circle class="nod" cx="14" cy="32" r="2.4"/><circle class="nod" cx="32" cy="32" r="2.4"/>
    </g>

    <!-- network graph 1 -->
    <g transform="translate(420 250) rotate(4)">
      <line class="net" x1="0"  y1="0"  x2="44" y2="-20"/>
      <line class="net" x1="44" y1="-20" x2="80" y2="14"/>
      <line class="net" x1="0"  y1="0"  x2="34" y2="40"/>
      <line class="net" x1="34" y1="40" x2="80" y2="14"/>
      <circle class="nod" cx="0"  cy="0"  r="5"/>
      <circle class="nod" cx="44" cy="-20" r="5"/>
      <circle class="nod" cx="80" cy="14" r="5"/>
      <circle class="nod" cx="34" cy="40" r="5"/>
    </g>

    <!-- network graph 2 -->
    <g transform="translate(150 230) rotate(-7)">
      <line class="net" x1="0"  y1="0"  x2="40" y2="24"/>
      <line class="net" x1="40" y1="24" x2="8"  y2="52"/>
      <line class="net" x1="0"  y1="0"  x2="8"  y2="52"/>
      <circle class="nod" cx="0"  cy="0"  r="5"/>
      <circle class="nod" cx="40" cy="24" r="5"/>
      <circle class="nod" cx="8"  cy="52" r="5"/>
    </g>

    <!-- network graph 3 -->
    <g transform="translate(330 430) rotate(10)">
      <line class="net" x1="0"  y1="0"  x2="50" y2="0"/>
      <line class="net" x1="50" y1="0"  x2="90" y2="26"/>
      <line class="net" x1="0"  y1="0"  x2="20" y2="40"/>
      <circle class="nod" cx="0"  cy="0"  r="5"/>
      <circle class="nod" cx="50" cy="0"  r="5"/>
      <circle class="nod" cx="90" cy="26" r="5"/>
      <circle class="nod" cx="20" cy="40" r="5"/>
    </g>

    <!-- chip 1 -->
    <g transform="translate(560 200) rotate(-6)">
      <rect class="chip" x="0" y="0" width="46" height="46" rx="6"/>
      <rect class="chip" x="14" y="14" width="18" height="18" rx="2"/>
      <path class="chip" d="M12 0 v-8 M34 0 v-8 M12 46 v8 M34 46 v8 M0 14 h-8 M0 32 h-8 M46 14 h8 M46 32 h8"/>
    </g>

    <!-- chip 2 -->
    <g transform="translate(90 530) rotate(9)">
      <rect class="chip" x="0" y="0" width="40" height="40" rx="6"/>
      <rect class="chip" x="12" y="12" width="16" height="16" rx="2"/>
      <path class="chip" d="M10 0 v-7 M30 0 v-7 M10 40 v7 M30 40 v7 M0 12 h-7 M0 28 h-7 M40 12 h7 M40 28 h7"/>
    </g>

    <!-- small scattered nodes -->
    <circle class="nod" cx="690" cy="430" r="4"/>
    <circle class="nod" cx="220" cy="80"  r="4"/>
    <circle class="nod" cx="680" cy="120" r="4"/>
    <circle class="nod" cx="40"  cy="300" r="4"/>

  </g>
</svg>
