<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" viewBox="0 0 820 820">
  <defs>
    <style>
      .sym  { font-family: "Latin Modern Math", "STIX Two Math", Georgia, serif; fill: #d7dce8; }
      .net  { fill: none; stroke: #d7dce8; stroke-width: 1.4; stroke-linecap: round; }
      .nod  { fill: #d7dce8; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; fill: #d7dce8; }
    </style>
  </defs>
  <g opacity="0.85">

    <!-- math symbols (smaller, sparse) -->
    <text class="sym" x="120" y="140" font-size="30" transform="rotate(-10 120 140)">&#8711;</text>
    <text class="sym" x="640" y="180" font-size="32" transform="rotate(8 640 180)">&#931;</text>
    <text class="sym" x="380" y="380" font-size="30" transform="rotate(-6 380 380)">&#8747;</text>
    <text class="sym" x="170" y="560" font-size="30" transform="rotate(6 170 560)">&#955;</text>
    <text class="mono" x="150" y="320" font-size="14" transform="rotate(-6 150 320)">min-max</text>
    <text class="mono" x="600" y="600" font-size="14" transform="rotate(6 600 600)">min-max</text>

    <!-- network graph (smaller) -->
    <g transform="translate(545 385) rotate(4)">
      <line class="net" x1="0"  y1="0"  x2="30" y2="-12"/>
      <line class="net" x1="30" y1="-12" x2="54" y2="11"/>
      <line class="net" x1="0"  y1="0"  x2="23" y2="26"/>
      <circle class="nod" cx="0"  cy="0"   r="3.2"/>
      <circle class="nod" cx="30" cy="-12" r="3.2"/>
      <circle class="nod" cx="54" cy="11"  r="3.2"/>
      <circle class="nod" cx="23" cy="26"  r="3.2"/>
    </g>

  </g>
</svg>
