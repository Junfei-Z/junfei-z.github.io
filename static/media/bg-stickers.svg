<svg xmlns="http://www.w3.org/2000/svg" width="820" height="820" viewBox="0 0 820 820">
  <defs>
    <style>
      .sym  { font-family: "Latin Modern Math", "STIX Two Math", Georgia, serif; fill: #d7dce8; }
      .net  { fill: none; stroke: #d7dce8; stroke-width: 1.6; stroke-linecap: round; }
      .nod  { fill: #d7dce8; }
      .chip { fill: none; stroke: #d7dce8; stroke-width: 1.6; stroke-linejoin: round; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; fill: #d7dce8; }
    </style>
  </defs>
  <g opacity="0.85">

    <!-- math symbols (sparse) -->
    <text class="sym" x="120" y="140" font-size="44" transform="rotate(-10 120 140)">&#8711;</text>
    <text class="sym" x="640" y="180" font-size="48" transform="rotate(8 640 180)">&#931;</text>
    <text class="sym" x="380" y="380" font-size="46" transform="rotate(-6 380 380)">&#8747;</text>
    <text class="sym" x="170" y="560" font-size="44" transform="rotate(6 170 560)">&#955;</text>
    <text class="mono" x="600" y="600" font-size="20" transform="rotate(6 600 600)">argmin</text>

    <!-- network graph -->
    <g transform="translate(540 380) rotate(4)">
      <line class="net" x1="0"  y1="0"  x2="44" y2="-18"/>
      <line class="net" x1="44" y1="-18" x2="78" y2="16"/>
      <line class="net" x1="0"  y1="0"  x2="34" y2="38"/>
      <circle class="nod" cx="0"  cy="0"   r="4.5"/>
      <circle class="nod" cx="44" cy="-18" r="4.5"/>
      <circle class="nod" cx="78" cy="16"  r="4.5"/>
      <circle class="nod" cx="34" cy="38"  r="4.5"/>
    </g>

    <!-- chip -->
    <g transform="translate(150 320) rotate(-6)">
      <rect class="chip" x="0" y="0" width="42" height="42" rx="6"/>
      <rect class="chip" x="13" y="13" width="16" height="16" rx="2"/>
      <path class="chip" d="M11 0 v-7 M31 0 v-7 M11 42 v7 M31 42 v7 M0 13 h-7 M0 29 h-7 M42 13 h7 M42 29 h7"/>
    </g>

  </g>
</svg>
