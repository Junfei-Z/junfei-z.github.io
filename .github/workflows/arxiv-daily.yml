name: Daily arXiv Paper Fetch

on:
  schedule:
    # Run at 00:07 UTC Mon-Fri = 08:07 Beijing time (CST, UTC+8).
    # arXiv has no weekend updates, so skip Sat/Sun. The :07 offset avoids the
    # top-of-hour GitHub Actions cron rush (which can delay scheduled runs).
    - cron: '7 0 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install wordcloud

      - name: Fetch arXiv papers and generate summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_EMAIL_EI: ${{ secrets.NOTIFY_EMAIL_EI }}
        run: python scripts/fetch_arxiv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/diary/arxiv-daily.json static/diary/arxiv-seen.json static/diary/wordcloud_*.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily arXiv papers [skip ci]"
            # Retry push in case the remote moved (another commit landed) between
            # checkout and now — rebase our commit on top and try again.
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed successfully"
                break
              fi
              echo "Push rejected, rebasing on origin/main (attempt $attempt)..."
              git pull --rebase origin main
            done
          fi
