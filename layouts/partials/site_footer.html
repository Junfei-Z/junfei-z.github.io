<footer class="site-footer" style="text-align: center;">
  <p class="powered-by">
    {{ with site.Params.footer.copyright.notice }}
      {{ replace . "{year}" now.Year | safeHTML }}
    {{ end }}
    <br>
    <span style="font-size: 0.9em; color: #6c757d;">
      {{ with .GitInfo }}
        Last updated: {{ .AuthorDate.Format "January 2, 2006" }}
      {{ else }}
        Last updated: {{ now.Format "January 2, 2006" }}
      {{ end }}
    </span>
  </p>
</footer>
